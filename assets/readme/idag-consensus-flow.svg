<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="idag-title idag-desc">
  <title id="idag-title">IDAG consensus flow</title>
  <desc id="idag-desc">A left-to-right flow from GHOSTDAG ordering through adaptive DAGKNIGHT ordering with k from 3 to 32, ending in proof-of-stake finality. Finality is tentative at one-third stake, soft at one-half stake, and hard at two-thirds stake; state becomes binding after three consecutive hard epochs.</desc>
  <defs>
    <linearGradient id="idag-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020403"/>
      <stop offset="0.5" stop-color="#07110A"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="idag-flow" x1="340" y1="196" x2="860" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF88"/>
      <stop offset="0.5" stop-color="#B7FF3C"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
    <pattern id="idag-mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39FF88" stroke-opacity="0.045"/>
      <path d="M0 20H40M20 0V40" fill="none" stroke="#7A8B80" stroke-opacity="0.025"/>
    </pattern>
    <pattern id="idag-scan" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5H5" stroke="#D8FFE7" stroke-opacity="0.02" stroke-width="0.5"/>
    </pattern>
    <marker id="idag-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#B7FF3C"/>
    </marker>
    <filter id="idag-glow" x="320" y="180" width="560" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .idag-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .idag-card { fill: #07110A; fill-opacity: 0.9; stroke: #39FF88; stroke-opacity: 0.68; stroke-width: 1.5; }
      .idag-kicker { fill: #7A8B80; font-size: 14px; font-weight: 700; letter-spacing: 1.6px; }
      .idag-name { fill: #D8FFE7; font-size: 26px; font-weight: 700; letter-spacing: 0.8px; }
      .idag-detail { fill: #39FF88; font-size: 18px; }
      .idag-chip { fill: #020403; stroke: #7A8B80; stroke-opacity: 0.38; }
      .idag-flow-line {
        stroke-dasharray: 14 10;
        animation: idag-flow 2.8s linear infinite;
      }
      .idag-flow-token { animation: idag-token 2.8s linear infinite; }
      .idag-flow-token-b { animation-delay: -1.4s; }
      .idag-chip-node {
        transform-box: fill-box;
        transform-origin: center;
        animation: idag-stage-pulse 7.2s ease-in-out infinite;
      }
      .idag-chip-2 { animation-delay: -5.4s; }
      .idag-chip-3 { animation-delay: -3.6s; }
      .idag-chip-4 { animation-delay: -1.8s; }
      .idag-confirm-ring { fill: none; stroke: #7A8B80; stroke-opacity: 0.55; stroke-width: 1; }
      .idag-confirm-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: idag-confirm-stage 6s ease-in-out infinite;
      }
      .idag-confirm-2 { animation-delay: -4s; }
      .idag-confirm-3 { animation-delay: -2s; }
      .idag-adaptive-card { animation: idag-adaptive-breathe 4.8s ease-in-out infinite; }
      .idag-hard-status { animation: idag-hard-breathe 3.6s ease-in-out infinite; }

      @keyframes idag-flow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes idag-token {
        0% { opacity: 0; transform: translateX(-48px); }
        15% { opacity: 0.55; }
        50% { opacity: 1; }
        85% { opacity: 0.55; }
        100% { opacity: 0; transform: translateX(48px); }
      }
      @keyframes idag-stage-pulse {
        0%, 22%, 100% { opacity: 0.58; transform: scale(1); }
        10% { opacity: 1; transform: scale(1.16); }
      }
      @keyframes idag-confirm-stage {
        0%, 12% { opacity: 1; transform: scale(1); }
        20%, 100% { opacity: 0.28; transform: scale(0.72); }
      }
      @keyframes idag-adaptive-breathe {
        0%, 100% { stroke-opacity: 0.68; }
        50% { stroke-opacity: 1; }
      }
      @keyframes idag-hard-breathe {
        0%, 100% { fill-opacity: 0.76; }
        50% { fill-opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .idag-flow-line,
        .idag-flow-token,
        .idag-chip-node,
        .idag-confirm-core,
        .idag-adaptive-card,
        .idag-hard-status { animation: none; }
        .idag-confirm-core { opacity: 1; transform: none; }
        .idag-flow-line { stroke-dasharray: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#idag-bg)"/>
  <rect width="1200" height="430" rx="22" fill="url(#idag-mesh)"/>
  <rect width="1200" height="430" rx="22" fill="url(#idag-scan)"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#7A8B80" stroke-opacity="0.45" stroke-width="2"/>

  <g class="idag-mono">
    <text x="48" y="48" fill="#39FF88" font-size="14" font-weight="700" letter-spacing="2.2">IDAG // INCREMENTAL DAG CONSENSUS</text>
    <text x="48" y="82" fill="#D8FFE7" font-size="27" font-weight="700" letter-spacing="0.8">CONSENSUS FLOW</text>
    <text x="1152" y="61" text-anchor="end" fill="#B7FF3C" font-size="14" font-weight="700" letter-spacing="1.8">ORDER → ADAPT → FINALIZE</text>

    <path class="idag-flow-line" d="M340 196H449" fill="none" stroke="url(#idag-flow)" stroke-width="2.5" marker-end="url(#idag-arrow)" filter="url(#idag-glow)"/>
    <path class="idag-flow-line" d="M751 196H860" fill="none" stroke="url(#idag-flow)" stroke-width="2.5" marker-end="url(#idag-arrow)" filter="url(#idag-glow)"/>
    <circle class="idag-flow-token idag-flow-token-a" cx="395" cy="196" r="3" fill="#B7FF3C"/>
    <circle class="idag-flow-token idag-flow-token-b" cx="806" cy="196" r="3" fill="#B7FF3C"/>

    <g transform="translate(60 122)">
      <rect class="idag-card" width="280" height="148" rx="14"/>
      <path class="idag-stage-accent idag-stage-1" d="M0 14Q0 0 14 0H68" fill="none" stroke="#39FF88" stroke-width="4"/>
      <circle class="idag-confirm-ring" cx="226" cy="24" r="7"/>
      <circle class="idag-confirm-core idag-confirm-1" cx="226" cy="24" r="3" fill="#39FF88"/>
      <text class="idag-kicker" x="24" y="34">ORDERING</text>
      <text class="idag-name" x="24" y="75">GHOSTDAG</text>
      <text class="idag-detail" x="24" y="112">Ordering</text>
      <text x="256" y="126" text-anchor="end" fill="#7A8B80" font-size="14">01</text>
    </g>

    <g transform="translate(460 122)">
      <rect class="idag-adaptive-card" width="280" height="148" rx="14" fill="#07110A" fill-opacity="0.95" stroke="#B7FF3C" stroke-width="2"/>
      <path class="idag-stage-accent idag-stage-2" d="M0 14Q0 0 14 0H68" fill="none" stroke="#B7FF3C" stroke-width="4"/>
      <circle class="idag-confirm-ring" cx="226" cy="24" r="7"/>
      <circle class="idag-confirm-core idag-confirm-2" cx="226" cy="24" r="3" fill="#B7FF3C"/>
      <text x="24" y="34" fill="#B7FF3C" font-size="14" font-weight="700" letter-spacing="1.6">ADAPTIVE ORDERING</text>
      <text class="idag-name" x="24" y="75">DAGKNIGHT</text>
      <text x="24" y="112" fill="#B7FF3C" font-size="18">Adaptive · k = 3...32</text>
      <text x="256" y="126" text-anchor="end" fill="#7A8B80" font-size="14">02</text>
    </g>

    <g transform="translate(860 122)">
      <rect class="idag-card" width="280" height="148" rx="14"/>
      <path class="idag-stage-accent idag-stage-3" d="M0 14Q0 0 14 0H68" fill="none" stroke="#39FF88" stroke-width="4"/>
      <circle class="idag-confirm-ring" cx="226" cy="44" r="7"/>
      <circle class="idag-confirm-core idag-confirm-3" cx="226" cy="44" r="3" fill="#39FF88"/>
      <text class="idag-kicker" x="24" y="28">STAKE FINALITY</text>
      <text x="256" y="28" text-anchor="end" fill="#7A8B80" font-size="14">03</text>
      <text x="24" y="57" fill="#D8FFE7" font-size="21" font-weight="700" letter-spacing="0.6">PoS FINALITY</text>
      <text x="24" y="84" fill="#7A8B80" font-size="14" font-weight="700" letter-spacing="0.8">TENTATIVE</text>
      <text x="256" y="84" text-anchor="end" fill="#39FF88" font-size="16" font-weight="700">≥ 1/3</text>
      <text x="24" y="105" fill="#7A8B80" font-size="14" font-weight="700" letter-spacing="0.8">SOFT</text>
      <text x="256" y="105" text-anchor="end" fill="#39FF88" font-size="16" font-weight="700">≥ 1/2</text>
      <text class="idag-hard-status" x="24" y="126" fill="#B7FF3C" font-size="14" font-weight="700" letter-spacing="0.8">HARD</text>
      <text x="256" y="126" text-anchor="end" fill="#B7FF3C" font-size="16" font-weight="700">≥ 2/3</text>
    </g>

    <line x1="48" y1="304" x2="1152" y2="304" stroke="#7A8B80" stroke-opacity="0.28"/>

    <g transform="translate(48 330)">
      <rect class="idag-chip" width="228" height="54" rx="10"/>
      <circle class="idag-chip-node idag-chip-1" cx="22" cy="27" r="4" fill="#B7FF3C"/>
      <text x="38" y="33" fill="#D8FFE7" font-size="16">~1s blocks</text>
    </g>
    <g transform="translate(290 330)">
      <rect class="idag-chip" width="278" height="54" rx="10"/>
      <circle class="idag-chip-node idag-chip-2" cx="22" cy="27" r="4" fill="#39FF88"/>
      <text x="38" y="33" fill="#D8FFE7" font-size="16">300KB–8MB adaptive</text>
    </g>
    <g transform="translate(582 330)">
      <rect class="idag-chip" width="282" height="54" rx="10"/>
      <circle class="idag-chip-node idag-chip-3" cx="22" cy="27" r="4" fill="#39FF88"/>
      <text x="38" y="33" fill="#D8FFE7" font-size="16">POEM entropy weighting</text>
    </g>
    <g transform="translate(878 330)">
      <rect class="idag-chip" width="274" height="54" rx="10"/>
      <circle class="idag-chip-node idag-chip-4" cx="22" cy="27" r="4" fill="#B7FF3C"/>
      <text x="38" y="23" fill="#D8FFE7" font-size="14">3 consecutive HARD epochs</text>
      <text x="38" y="42" fill="#B7FF3C" font-size="14" font-weight="700">→ binding</text>
    </g>
  </g>
</svg>
