<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="otr-title otr-desc" font-family="monospace">
  <title id="otr-title">OpenTine agent run tree</title>
  <desc id="otr-desc">A Ghost Mesh-colored execution timeline with a mint primary run and a lime forked branch.</desc>
  <defs>
    <linearGradient id="otr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07110A"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="otr-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#B7FF3C"/>
    </linearGradient>
    <filter id="otr-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#otr-bg)"/>
  <rect x="0" y="0" width="1200" height="560" fill="none" stroke="#7A8B80" stroke-opacity="0.35" stroke-width="1"/>

  <text x="40" y="48" fill="#D8FFE7" font-size="22" font-weight="600" letter-spacing="0.5">opentine</text>
  <text x="40" y="72" fill="#7A8B80" font-size="13">git for agent runs — content-addressed, forkable, replayable</text>
  <text x="1160" y="48" fill="#B7FF3C" font-size="12" text-anchor="end" letter-spacing="2">RUN TREE</text>

  <line x1="40" y1="94" x2="1160" y2="94" stroke="#7A8B80" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Root -->
  <g transform="translate(100,150)">
    <circle r="14" fill="#020403" stroke="url(#otr-signal)" stroke-width="2.5" filter="url(#otr-glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#39FF88" font-size="14" font-weight="700">◆</text>
    <text x="0" y="-26" text-anchor="middle" fill="#D8FFE7" font-size="12" font-weight="600">run_a3f8</text>
    <text x="0" y="40" text-anchor="middle" fill="#7A8B80" font-size="10">root</text>
  </g>

  <!-- Main timeline path -->
  <path d="M 114 150 L 230 150" stroke="#39FF88" stroke-width="2" fill="none"/>
  <path d="M 258 150 L 374 150" stroke="#39FF88" stroke-width="2" fill="none"/>
  <path d="M 402 150 L 518 150" stroke="#39FF88" stroke-width="2" fill="none"/>
  <path d="M 546 150 L 662 150" stroke="#39FF88" stroke-width="2" fill="none"/>
  <path d="M 690 150 L 806 150" stroke="#39FF88" stroke-width="2" fill="none"/>
  <path d="M 834 150 L 950 150" stroke="#39FF88" stroke-width="2" fill="none"/>

  <!-- Main steps -->
  <g font-size="11" fill="#D8FFE7">
    <g transform="translate(244,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#07110A" stroke="#7A8B80" stroke-opacity="0.38"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 1</text>
      <text y="4" text-anchor="middle" fill="#39FF88">think</text>
    </g>
    <g transform="translate(388,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#07110A" stroke="#7A8B80" stroke-opacity="0.38"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 2</text>
      <text y="4" text-anchor="middle" fill="#D8FFE7">search</text>
    </g>
    <g transform="translate(532,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#07110A" stroke="#7A8B80" stroke-opacity="0.38"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 3</text>
      <text y="4" text-anchor="middle" fill="#39FF88">think</text>
    </g>
    <g transform="translate(676,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#07110A" stroke="#7A8B80" stroke-opacity="0.38"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 4</text>
      <text y="4" text-anchor="middle" fill="#D8FFE7">fetch</text>
    </g>
    <g transform="translate(820,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#07110A" stroke="#7A8B80" stroke-opacity="0.38"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 5</text>
      <text y="4" text-anchor="middle" fill="#39FF88">think</text>
    </g>
    <g transform="translate(964,150)">
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="#39FF88" stroke="#39FF88"/>
      <text y="-22" text-anchor="middle" fill="#7A8B80" font-size="9">step 6</text>
      <text y="4" text-anchor="middle" fill="#020403" font-weight="700">done</text>
    </g>
  </g>

  <text x="964" y="200" text-anchor="middle" fill="#7A8B80" font-size="10" font-style="italic">completed</text>

  <!-- Fork arrow from step 2 -->
  <path d="M 388 166 Q 388 240 460 280 L 560 320" stroke="#B7FF3C" stroke-width="2" fill="none" stroke-dasharray="0" marker-end="url(#otr-arrow)"/>
  <defs>
    <marker id="otr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7FF3C"/>
    </marker>
  </defs>

  <text x="408" y="230" fill="#B7FF3C" font-size="10" font-style="italic">fork from step 2</text>

  <!-- Forked branch -->
  <g transform="translate(580,340)">
    <circle r="12" fill="#020403" stroke="url(#otr-signal)" stroke-width="2.5" filter="url(#otr-glow)"/>
    <text x="0" y="4" text-anchor="middle" fill="#B7FF3C" font-size="12" font-weight="700">◆</text>
    <text x="0" y="-22" text-anchor="middle" fill="#B7FF3C" font-size="11" font-weight="600">run_b7c1</text>
    <text x="0" y="36" text-anchor="middle" fill="#7A8B80" font-size="9">forked</text>
  </g>

  <path d="M 592 340 L 692 340" stroke="#B7FF3C" stroke-width="2" fill="none"/>
  <path d="M 720 340 L 820 340" stroke="#B7FF3C" stroke-width="2" fill="none"/>
  <path d="M 848 340 L 948 340" stroke="#B7FF3C" stroke-width="2" fill="none"/>

  <g font-size="11">
    <g transform="translate(706,340)">
      <rect x="-26" y="-15" width="52" height="30" rx="4" fill="#07110A" stroke="#B7FF3C" stroke-width="1.2"/>
      <text y="-21" text-anchor="middle" fill="#7A8B80" font-size="9">step 2'</text>
      <text y="4" text-anchor="middle" fill="#B7FF3C">search*</text>
    </g>
    <g transform="translate(834,340)">
      <rect x="-26" y="-15" width="52" height="30" rx="4" fill="#07110A" stroke="#B7FF3C" stroke-width="1.2"/>
      <text y="-21" text-anchor="middle" fill="#7A8B80" font-size="9">step 3</text>
      <text y="4" text-anchor="middle" fill="#B7FF3C">think</text>
    </g>
    <g transform="translate(962,340)">
      <rect x="-26" y="-15" width="52" height="30" rx="4" fill="#B7FF3C" stroke="#B7FF3C"/>
      <text y="-21" text-anchor="middle" fill="#7A8B80" font-size="9">step 4</text>
      <text y="4" text-anchor="middle" fill="#020403" font-weight="700">done</text>
    </g>
  </g>

  <text x="706" y="386" fill="#B7FF3C" font-size="9" font-style="italic">*different query</text>

  <!-- Bottom stats -->
  <line x1="40" y1="450" x2="1160" y2="450" stroke="#7A8B80" stroke-opacity="0.35" stroke-width="1"/>

  <g font-size="11" fill="#7A8B80">
    <g transform="translate(80,490)">
      <text y="0" fill="#B7FF3C" font-size="10" letter-spacing="1.5">FORK</text>
      <text y="22" fill="#D8FFE7">tine fork run_a3f8 --from-step 2</text>
    </g>
    <g transform="translate(440,490)">
      <text y="0" fill="#B7FF3C" font-size="10" letter-spacing="1.5">REPLAY</text>
      <text y="22" fill="#D8FFE7">tine replay run_b7c1 --from-step 3</text>
    </g>
    <g transform="translate(820,490)">
      <text y="0" fill="#B7FF3C" font-size="10" letter-spacing="1.5">DIFF</text>
      <text y="22" fill="#D8FFE7">tine diff run_a3f8 run_b7c1</text>
    </g>
  </g>

  <text x="1160" y="540" text-anchor="end" fill="#7A8B80" font-size="10">~250 LOC · any model · zero lock-in</text>
</svg>
