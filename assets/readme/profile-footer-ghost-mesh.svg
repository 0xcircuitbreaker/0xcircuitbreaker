<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="118" viewBox="0 0 1200 118" role="img" aria-labelledby="gmf-title gmf-desc">
  <title id="gmf-title">Ghost Mesh terminal signal footer</title>
  <desc id="gmf-desc">A bright green terminal signal crosses a dark hexagonal mesh and closes with a successful exit prompt.</desc>
  <defs>
    <linearGradient id="gmf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020403"/>
      <stop offset="0.55" stop-color="#07110A"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="gmf-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#B7FF3C" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="gmf-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5H4" stroke="#39FF88" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="gmf-hex" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M12 1h24l11 13-11 13H12L1 14Z" fill="none" stroke="#39FF88" stroke-opacity="0.1" stroke-width="0.8"/>
    </pattern>
    <filter id="gmf-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="118" fill="url(#gmf-bg)"/>
  <rect width="1200" height="118" fill="url(#gmf-hex)" opacity="0.55"/>
  <rect width="1200" height="118" fill="url(#gmf-scan)"/>

  <path d="M0 34C124 72 236 10 358 39S584 78 704 37s222-18 318 4 128 13 178-4v81H0Z" fill="#39FF88" opacity="0.06"/>
  <path d="M0 34C124 72 236 10 358 39S584 78 704 37s222-18 318 4 128 13 178-4" fill="none" stroke="url(#gmf-signal)" stroke-width="2.5" filter="url(#gmf-glow)"/>

  <g fill="none" stroke="#39FF88" stroke-width="1" opacity="0.42">
    <path d="M38 88h132l16-16h116"/>
    <path d="M898 72h116l16 16h132"/>
  </g>
  <g fill="#39FF88">
    <circle cx="38" cy="88" r="3"/>
    <circle cx="302" cy="72" r="3"/>
    <circle cx="898" cy="72" r="3"/>
    <circle cx="1162" cy="88" r="3"/>
  </g>

  <rect x="426" y="63" width="348" height="38" rx="7" fill="#020403" fill-opacity="0.9" stroke="#39FF88" stroke-opacity="0.24"/>
  <text x="600" y="87" text-anchor="middle" fill="#39FF88" font-family="monospace" font-size="12" letter-spacing="1.5">root@circuitbreaker:~$ exit 0</text>
  <text x="42" y="106" fill="#7A8B80" font-family="monospace" font-size="9">signal::persisted</text>
  <text x="1158" y="106" text-anchor="end" fill="#7A8B80" font-family="monospace" font-size="9">mesh::standby</text>
</svg>
