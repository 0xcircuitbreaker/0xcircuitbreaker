<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="gm-title gm-desc">
  <title id="gm-title">Ghost Mesh profile hero for 0xcircuitbreaker</title>
  <desc id="gm-desc">A phosphor-green terminal identity over scanlines and a restrained hexagonal security mesh, with subtle signal and node motion.</desc>
  <defs>
    <style>
      .gm-route-flow,
      .gm-signal-flow {
        animation: gm-flow 7s linear infinite;
      }
      .gm-node-pulse {
        animation: gm-node 3.6s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .gm-node-pulse:nth-of-type(2) { animation-delay: 0.9s; }
      .gm-node-pulse:nth-of-type(3) { animation-delay: 1.8s; }
      .gm-node-pulse:nth-of-type(4) { animation-delay: 2.7s; }
      .gm-status {
        animation: gm-breathe 4.8s ease-in-out infinite;
      }
      @keyframes gm-flow {
        to { stroke-dashoffset: -112; }
      }
      @keyframes gm-node {
        0%, 20% { opacity: 0; transform: scale(0.55); }
        48% { opacity: 0.45; }
        82%, 100% { opacity: 0; transform: scale(2.25); }
      }
      @keyframes gm-breathe {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .gm-route-flow,
        .gm-signal-flow,
        .gm-node-pulse,
        .gm-status {
          animation: none !important;
        }
        .gm-node-pulse { display: none; }
      }
    </style>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020403"/>
      <stop offset="0.55" stop-color="#07110A"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="gm-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#B7FF3C" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="gm-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5H4" stroke="#39FF88" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="gm-hex" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M12 1h24l11 13-11 13H12L1 14Z" fill="none" stroke="#39FF88" stroke-opacity="0.11" stroke-width="0.8"/>
    </pattern>
    <filter id="gm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="180" fill="url(#gm-bg)"/>
  <rect width="1200" height="180" fill="url(#gm-hex)" opacity="0.6"/>
  <rect width="1200" height="180" fill="url(#gm-scan)"/>

  <g fill="none" stroke="#39FF88" stroke-width="1" opacity="0.4">
    <path d="M38 34h126l18 18h92l18-18h90"/>
    <path d="M818 34h88l16 16h116l18-16h106"/>
  </g>
  <g class="gm-route-flow" fill="none" stroke="#B7FF3C" stroke-width="1.2" stroke-dasharray="12 16" stroke-linecap="round" opacity="0.42">
    <path d="M38 34h126l18 18h92l18-18h90"/>
    <path d="M818 34h88l16 16h116l18-16h106"/>
  </g>
  <g fill="#39FF88">
    <circle cx="38" cy="34" r="3"/>
    <circle cx="382" cy="34" r="3"/>
    <circle cx="818" cy="34" r="3"/>
    <circle cx="1162" cy="34" r="3"/>
  </g>
  <g fill="none" stroke="#B7FF3C" stroke-width="1">
    <circle class="gm-node-pulse" cx="38" cy="34" r="5"/>
    <circle class="gm-node-pulse" cx="382" cy="34" r="5"/>
    <circle class="gm-node-pulse" cx="818" cy="34" r="5"/>
    <circle class="gm-node-pulse" cx="1162" cy="34" r="5"/>
  </g>

  <path d="M0 142C130 106 210 156 334 125S548 96 655 132s195 25 296-8 160-35 249-2v58H0Z" fill="#39FF88" opacity="0.065"/>
  <path d="M0 142C130 106 210 156 334 125S548 96 655 132s195 25 296-8 160-35 249-2" fill="none" stroke="url(#gm-signal)" stroke-width="2.5" filter="url(#gm-glow)"/>
  <path class="gm-signal-flow" d="M0 142C130 106 210 156 334 125S548 96 655 132s195 25 296-8 160-35 249-2" fill="none" stroke="#B7FF3C" stroke-width="1.25" stroke-dasharray="3 25" stroke-linecap="round" opacity="0.72"/>
  <path d="M0 168h86l10-16 9 25 11-43 13 43 13-21 9 12h1049" fill="none" stroke="#B7FF3C" stroke-opacity="0.55"/>

  <rect x="338" y="20" width="524" height="118" rx="10" fill="#020403" fill-opacity="0.88" stroke="#39FF88" stroke-opacity="0.22"/>
  <text x="600" y="67" text-anchor="middle" fill="#39FF88" font-family="monospace" font-size="42" font-weight="700" letter-spacing="2">0xcircuitbreaker</text>
  <text x="600" y="94" text-anchor="middle" fill="#D8FFE7" font-family="monospace" font-size="15" letter-spacing="2.4">Founder | Lead Engineer</text>
  <text class="gm-status" x="600" y="121" text-anchor="middle" fill="#B7FF3C" font-family="monospace" font-size="13" letter-spacing="1.3">[ SIGNAL LOCKED ] [ SYSTEMS ONLINE ]</text>
  <text x="42" y="79" fill="#39FF88" opacity="0.72" font-family="monospace" font-size="12">root@circuitbreaker:~$ mesh --lock</text>
  <text x="1158" y="79" text-anchor="end" fill="#7A8B80" font-family="monospace" font-size="12">channel::encrypted</text>
</svg>
